name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: python -m pip install --requirement app/requirements-dev.txt
      - run: ruff check app
      - run: bandit -r app --severity-level medium --confidence-level medium
      - run: python -m pytest -q app/tests
      - run: pip-audit --requirement app/requirements-dev.txt

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python,javascript-typescript"

  image-security:
    name: Container image security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --tag observatory-api:ci ./app
      - name: Build frontend image
        run: docker build --tag observatory-frontend:ci ./frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: observatory-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: observatory-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  dast:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated test stack
        run: docker compose up --build --detach
      - name: Wait for the app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Scan frontend
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8081/
          rules_file_name: .zap/rules.tsv
          artifact_name: zap-ui-report
          fail_action: true
          allow_issue_writing: false
      - name: Scan API
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8081/api/overview
          rules_file_name: .zap/api-rules.tsv
          artifact_name: zap-api-report
          fail_action: true
          allow_issue_writing: false
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish immutable images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [image-security, dast, codeql]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/argocd-observatory-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/argocd-observatory-ui:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
